[package]
name = "hadaka-agent"
version = "0.1.0"
edition = "2024"
description = "A task-focused, security-first agent runtime designed to remain simple and reviewable."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/MarmaladeSky/hadaka-agent"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eventsource-stream = "0.2"
futures-util = "0.3"
globset = "0.4"
html2text = "0.17"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "job-object"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "process", "signal", "sync", "time"] }
toml = "1"
tempfile = "3"

[[example]]
name = "mcp_fixture"
path = "tests/fixtures/mcp_server.rs"
